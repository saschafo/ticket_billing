<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ticket Billing</title>
  <meta name="description" content="Ticket Billing" />

  <style>
    /* Frappe-eigene Elemente verstecken -- hier rendert ausschliesslich die SPA. */
    .navbar, .page-head, nav.navbar, footer.web-footer,
    .web-footer, #navbar, .container > .page-header { display: none !important; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #f8fafc; }
    * { -webkit-tap-highlight-color: transparent; }
  </style>

  <script type="module" crossorigin src="/assets/ticket_billing/frontend/assets/index.js"></script>
  <link rel="stylesheet" href="/assets/ticket_billing/frontend/assets/index.css" />
</head>
<body>
  <div id="app"></div>
  <script>
    // Startwerte fuer die SPA. Ohne diese Zeilen muesste die Shell erst einen
    // API-Aufruf abwarten, bevor sie ueberhaupt etwas anzeigen kann.
    window.csrf_token = "{{ csrf_token }}";
    window.frappe_session_user = "{{ session_user }}";
    window.frappe_user_roles = {{ roles_json }};
    window.frappe_boot_lang = "{{ lang }}";
    window.frappe = window.frappe || {};
    window.frappe.csrf_token = window.csrf_token;
  </script>
</body>
</html>
